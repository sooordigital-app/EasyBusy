<style>
  :root{
    --blue:#3f5cf2;
    --blue-dark:#2f47d1;
    --blue-light:#eef1fe;
    --green:#1b9c5b;
    --green-light:#e8f8f0;
    --red:#e0453b;
    --red-light:#fdecea;
    --amber:#e0a800;
    --bg:#f4f5fa;
    --sidebar:#ffffff;
    --border:#e6e8f0;
    --text:#1f2430;
    --text-dim:#6b7280;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior-y:contain;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:contain;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---- App shell ---- */
  .app{display:flex;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:contain;}

  /* ---- Sidebar ---- */
  .sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--border);padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;}
  .sidebar-footer{margin-top:auto;padding:12px 8px 10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);}
  .sidebar-action-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#6b7280;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;}
  .sidebar-action-btn:hover{background:#f7f8fc;}
  .sidebar-backup-btn{color:var(--blue);border-color:#d9defc;background:#f8f9ff;}
  .sidebar-backup-btn:hover{background:var(--blue-light);border-color:#cbd2ff;}
  .sidebar-import-btn{color:#555f70;}
  .sidebar-action-btn span{font-size:14px;line-height:1;}
  .contact-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:8px;margin-top:10px;text-decoration:none;color:var(--text);}
  .contact-row:hover{background:#f7f8fc;}
  .contact-row .ico{font-size:18px;}
  .contact-row .lbl{font-size:11px;color:var(--text-dim);}
  .contact-row .val{font-size:14px;font-weight:600;}
  .confirm-modal{text-align:center;padding:28px 26px 24px;}
  .confirm-icon{width:52px;height:52px;border-radius:50%;background:#fdecec;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .confirm-icon:not(.danger){background:var(--blue-light,#eef1fe);}
  .confirm-title{font-size:17px;margin:0 0 8px;}
  .confirm-msg{font-size:13.5px;color:var(--text-dim);margin:0 0 6px;line-height:1.5;}
  .row-menu-wrap{position:relative;display:flex;align-items:center;}
  .row-menu-btn{background:none;border:none;color:var(--text-dim);font-size:19px;padding:4px 8px;border-radius:6px;cursor:pointer;line-height:1;}
  .row-menu-btn:hover{background:#f0f1f5;}
  .row-menu{position:absolute;top:calc(100% + 4px);right:0;min-width:170px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(20,22,35,.14);padding:6px;z-index:60;}
  .row-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:9px 10px;font-size:13.5px;border-radius:6px;cursor:pointer;color:var(--text);}
  .row-menu button:hover{background:#f5f6fa;}
  .row-menu button.danger{color:var(--red);}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--blue);padding:0 8px 20px 8px;}
  .logo .mark{width:36px;height:32px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .logo .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .nav-section{font-size:11px;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;margin:16px 8px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);font-size:14px;color:#3a3f4b;cursor:pointer;}
  .nav-item .ico{width:18px;text-align:center;}
  .nav-item.active{background:var(--blue);color:#fff;font-weight:600;}
  .nav-item:not(.active):hover{background:#f1f3fb;}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain;padding:22px 28px;}
  #view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
  .page-flex{display:flex;flex-direction:column;height:100%;min-height:0;}
  .page-flex-top{flex-shrink:0;}
  .page-flex-scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;}
  .page-flex-bottom{flex-shrink:0;}
  .tx-fixed-actions{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:#fff;
    box-shadow:0 -4px 16px rgba(20,22,35,.10);
  }
  @media (min-width:861px){
    .tx-fixed-actions{ left:220px; }
  }
  .tx-fixed-actions .btn{flex:1;padding:14px 0;font-size:15px;border-radius:10px;font-weight:700;letter-spacing:.2px;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .tx-scroll-pad{padding-bottom:88px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
  .user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}

  h1.page-title{font-size:22px;margin:0 0 18px;}

  .btn{border:none;border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{background:#f7f8fc;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-backup{padding:10px 18px;font-size:14px;transition:background .15s,box-shadow .15s,transform .15s;}
  .btn-backup svg{width:16px;height:16px;flex-shrink:0;}
  .btn-export{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;box-shadow:0 2px 6px rgba(63,92,242,.28);}
  .btn-export:hover{box-shadow:0 4px 12px rgba(63,92,242,.38);transform:translateY(-1px);}
  .btn-import{background:#fff;border:1.5px solid var(--blue);color:var(--blue);}
  .btn-import:hover{background:var(--blue-light);transform:translateY(-1px);}

  /* ---- Business switcher (top-right dropdown) ---- */
  .biz-select{position:relative;}
  .biz-select-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:8px 12px;font-size:14px;min-width:220px;max-width:280px;font-weight:600;color:var(--text);}
  .biz-select-btn .chev{margin-left:auto;color:var(--text-dim);font-size:14px;font-weight:900;}
  .biz-select-btn span#bizSelectLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .biz-ico{width:22px;height:22px;border-radius:5px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .biz-dropdown{position:absolute;top:calc(100% + 6px);right:0;width:300px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(20,22,35,.14);padding:10px;z-index:50;}
  .biz-search{position:relative;margin-bottom:8px;}
  .biz-search input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:#fff;}
  .biz-search .ico{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;}
  .biz-list{max-height:220px;overflow-y:auto;margin-bottom:8px;}
  .biz-list-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:6px;font-size:14px;cursor:pointer;}
  .biz-list-item:hover{background:#f7f8fc;}
  .biz-list-item.sel{background:var(--blue-light);}
  .biz-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;}
  .biz-list-item.sel .biz-radio{border-color:var(--blue);}
  .biz-list-item.sel .biz-radio::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--blue);}
  .biz-add-btn{width:100%;justify-content:center;}

  /* ---- Books list page ---- */
  .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search-input{position:relative;flex:1;min-width:220px;max-width:420px;}
  .search-input input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:#fff;}
  .search-input .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);}
  select.sort{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;background:#fff;font-size:14px;}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);}
  .book-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
  .book-row:last-child{border-bottom:none;}
  .book-info{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .book-icon{width:34px;height:34px;border-radius:6px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .book-name{font-weight:600;font-size:15px;}
  .book-meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .book-actions{display:flex;align-items:center;gap:16px;}
  .book-balance{font-weight:700;font-size:14px;min-width:70px;text-align:right;}
  .icon-btn{background:none;border:none;color:var(--text-dim);font-size:15px;padding:4px;border-radius:4px;}
  .icon-btn:hover{color:var(--blue);background:var(--blue-light);}
  .icon-btn.danger:hover{color:var(--red);background:var(--red-light);}

  .add-book-tile{display:flex;align-items:center;gap:12px;padding:16px 18px;}
  .add-book-tile .book-icon{background:var(--green-light);color:var(--green);}
  .quick-tags{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .quick-tags span{border:1px solid var(--border);color:var(--blue);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;}
  .quick-tags span:hover{background:var(--blue-light);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-dim);}
  .empty-state .big{font-size:15px;color:var(--text);margin-bottom:6px;}

  /* ---- Transactions page ---- */
  .tx-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .tx-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;}
  .tx-sel-actions{display:flex;align-items:center;gap:4px;}
  .tx-sel-actions .icon-btn{font-size:17px;padding:6px 9px;}
  .col-select{width:36px;}
  .tx-select-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);color:#fff;font-size:12px;cursor:pointer;}
  .tx-select-mark.checked{background:var(--blue);border-color:var(--blue);}
  tr.tx-row-selected{background:var(--blue-light,#eef1fe);}
  .view-reports-link{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:11px;margin-bottom:16px;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;}
  .back-btn{background:none;border:none;font-size:22px;font-weight:900;color:var(--text);padding:6px;border-radius:6px;line-height:1;}
  .back-btn:hover{background:#eceefb;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filters select{border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:8px 10px;font-size:13px;}

  .summary-bar{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .summary-card{flex:1;min-width:150px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .summary-card .label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .summary-card .val{font-size:18px;font-weight:700;}
  .summary-card.in .val{color:var(--green);}
  .summary-card.out .val{color:var(--red);}
  .summary-card.net .val{color:var(--blue);}

  .tx-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap;}

  .tx-list .book-row{padding:14px 18px;}
  .tx-left{display:flex;gap:12px;align-items:center;}
  .tx-dot{width:8px;height:8px;border-radius:50%;}
  .tx-dot.in{background:var(--green);}
  .tx-dot.out{background:var(--red);}
  .tx-remark{font-weight:600;font-size:14px;}
  .tx-meta{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .tx-amount{font-weight:700;font-size:15px;}
  .tx-amount.in{color:var(--green);}
  .tx-amount.out{color:var(--red);}

  /* ---- Transactions table ---- */
  .tx-table-wrap{overflow-x:auto;}
  .tx-table{width:100%;min-width:880px;border-collapse:collapse;}
  .tx-table thead th{text-align:left;font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.02em;padding:12px 14px;border-bottom:1px solid var(--border);background:#fafbfd;white-space:nowrap;}
  .tx-table tbody td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;white-space:nowrap;}
  .tx-table tbody tr:last-child td{border-bottom:none;}
  .tx-table tbody tr:hover{background:#fafbfd;}
  .tx-table td.col-details{white-space:normal;min-width:160px;}
  .tx-table th.col-amount, .tx-table td.col-amount{text-align:right;}
  .tx-table th.col-balance, .tx-table td.col-balance{text-align:right;}
  .tx-table th.col-actions, .tx-table td.col-actions{text-align:right;}
  .tx-date-main{font-weight:600;}
  .tx-date-sub{font-size:12px;color:var(--text-dim);}
  .tx-bill-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--blue);cursor:pointer;}
  .tx-bill-btn:hover{background:var(--blue-light);}
  .tx-no-bill{color:var(--text-dim);}
  .tx-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;background:#f1f3fb;color:#3a3f4b;}
  .tx-pill-mode{background:var(--blue-light);color:var(--blue);}

  /* ---- Mobile transaction cards (replaces the scrollable table on small screens) ---- */
  .tx-card-list{display:none;flex-direction:column;gap:10px;padding-top:6px;}
  .tx-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative;transition:border-color .15s,background .15s;}
  .tx-card.tx-row-selected{border-color:var(--blue);background:var(--blue-light);}
  .tx-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .tx-card-tags{display:flex;flex-wrap:wrap;gap:6px;padding-right:6px;}
  .tx-card-amount-wrap{text-align:right;flex-shrink:0;}
  .tx-card-amount-wrap .tx-amount{font-size:19px;}
  .tx-card-balance{font-size:12.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;}
  .tx-card-remark{font-size:14px;font-weight:600;margin-top:12px;word-break:break-word;}
  .tx-card-more{background:none;border:none;color:var(--blue);font-weight:600;font-size:13px;padding:8px 0 0;cursor:pointer;}
  .tx-card-more-fields{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-dim);}
  .tx-card-more-fields .row{display:flex;justify-content:space-between;gap:10px;}
  .tx-card-more-fields .row span:last-child{color:var(--text);text-align:right;}
  .tx-card-divider{height:1px;background:var(--border);margin:12px 0 10px;}
  .tx-card-footer{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-dim);}
  .tx-card-footer .entry-by{color:var(--blue);font-weight:600;}
  .tx-card-actions{display:flex;gap:6px;flex-shrink:0;}
  .tx-card-select-mark{position:absolute;top:-8px;left:-8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);}

  @media (max-width:760px){
    .tx-table-wrap{display:none;}
    .tx-card-list{display:flex;}
  }

  /* ---- Business Settings page ---- */
  .settings-layout{display:flex;gap:20px;align-items:flex-start;}
  .settings-subnav{width:220px;flex-shrink:0;}
  .settings-subnav-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .settings-subnav-item:hover{border-color:#c7cdf5;}
  .settings-subnav-item.active{border-color:var(--blue);background:var(--blue-light);}
  .settings-subnav-item .subnav-title{font-weight:600;font-size:14px;color:var(--text);}
  .settings-subnav-item.active .subnav-title{color:var(--blue);}
  .settings-subnav-item .subnav-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .settings-content{flex:1;min-width:0;}
  .profile-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .profile-card-head{display:flex;align-items:center;gap:12px;}
  .profile-card-head .book-icon{width:40px;height:40px;font-size:18px;}
  .profile-title{font-weight:700;font-size:16px;}
  .profile-warn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--red);margin-top:2px;}
  .strength-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin:14px 0 6px;}
  .strength-bar{height:6px;border-radius:4px;background:#eee;overflow:hidden;}
  .strength-bar-fill{height:100%;background:var(--red);}
  .strength-bar-fill.med{background:var(--amber);}
  .strength-bar-fill.high{background:var(--green);}
  .incomplete-banner{display:flex;gap:10px;align-items:flex-start;background:var(--blue-light);color:#33406b;border-radius:6px;padding:10px 12px;font-size:13px;margin-top:14px;}
  .settings-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .settings-section h4{font-size:14px;margin:0 0 14px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  .settings-field{display:flex;gap:12px;margin-bottom:16px;}
  .settings-field:last-child{margin-bottom:0;}
  .settings-field-icon{width:20px;color:var(--text-dim);padding-top:26px;text-align:center;flex-shrink:0;}
  .settings-field-body{flex:1;min-width:0;}
  .settings-field-body label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .settings-field-input-wrap{display:flex;gap:8px;}
  .settings-field-input-wrap input, .settings-field-body select{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:#fff;width:100%;}
  .settings-field-input-wrap input:disabled{color:var(--text);background:#fbfbfd;}
  .danger-zone{border:1px solid #f7d3cf;background:var(--red-light);border-radius:var(--radius);padding:18px 20px;}
  .danger-zone h4{margin:0 0 6px;color:var(--red);font-size:14px;}
  .danger-zone p{font-size:13px;color:var(--text-dim);margin:0 0 12px;}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,22,35,.45);display:flex;align-items:flex-start;justify-content:flex-end;z-index:100;}
  .overlay.center{align-items:center;justify-content:center;}
  .modal{background:#fff;width:420px;max-width:92vw;height:100%;overflow-y:auto;padding:24px;box-shadow:-4px 0 24px rgba(0,0,0,.08);}
  .overlay.center .modal{height:auto;max-height:90vh;border-radius:12px;width:420px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-head h2{font-size:18px;margin:0;}
  .modal-head.in h2{color:var(--green);}
  .modal-head.out h2{color:var(--red);}
  .modal-close{background:none;border:1px solid var(--border);border-radius:6px;width:28px;height:28px;font-size:14px;color:var(--text-dim);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .field .req{color:var(--red);}
  .field input, .field select, .field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:#fff;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .type-toggle{display:flex;gap:8px;margin-bottom:20px;}
  .type-toggle button{flex:1;padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;font-weight:600;font-size:14px;color:var(--text-dim);}
  .type-toggle button.sel-in{background:var(--green);border-color:var(--green);color:#fff;}
  .type-toggle button.sel-out{background:var(--red);border-color:var(--red);color:#fff;}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .tx-modal{display:flex;flex-direction:column;padding:0 !important;}
  .tx-modal .modal-head{padding:20px 24px 0;margin-bottom:14px;flex-shrink:0;}
  .tx-modal .tx-scroll{flex:1;overflow-y:auto;padding:0 24px;min-height:0;}
  .tx-modal .modal-footer{padding:12px 24px;margin:0;border-top:1px solid var(--border);flex-shrink:0;}
  .tx-modal .keypad{border-top:1px solid var(--border);padding:10px 14px calc(16px + env(safe-area-inset-bottom, 10px));background:#fafbfc;flex-shrink:0;}
  .keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .keypad-grid button{padding:16px 0;font-size:17px;border:none;border-radius:8px;background:#eef0f4;color:var(--text);cursor:pointer;font-weight:600;touch-action:manipulation;}
  .keypad-grid button.op{background:#eef1fe;color:var(--blue);}
  .keypad-grid button.eq{background:#eef1fe;color:var(--blue);}
  .keypad-grid button.go{background:var(--blue);color:#fff;font-size:18px;}
  .extra-fields-enter{animation:extraFieldsIn .18s ease;}
  @keyframes extraFieldsIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .helper{font-size:12px;color:var(--text-dim);margin-top:-8px;margin-bottom:16px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}

  ::placeholder{color:#9aa0ac;}

  /* ---- Mobile menu toggle + sidebar overlay ---- */
  .menu-toggle{display:none;background:#fff;border:1px solid var(--border);border-radius:var(--radius);width:38px;height:38px;font-size:18px;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
  .menu-toggle:hover{background:#f1f3fb;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(20,22,35,.45);z-index:150;}
  .sidebar-overlay.show{display:block;}
  .sidebar-close-btn{display:none;position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;background:transparent;color:var(--text-dim);font-size:18px;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;z-index:1;}
  .sidebar-close-btn:hover{background:#f1f3fb;color:var(--text);}

  @media (max-width:860px){
    .app{position:relative;}
    .sidebar{
      position:fixed;
      top:0;left:0;
      z-index:200;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:2px 0 24px rgba(0,0,0,.18);
    }
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{display:flex;}
    .sidebar-close-btn{display:flex;}
    .settings-layout{flex-direction:column;}
    .biz-select-btn{min-width:0;}
  }

  @media (max-width:480px){
    .main{padding:16px;}
    .topbar{gap:8px;}
    .biz-select-btn{padding:8px 10px;font-size:13px;}
    .biz-select-btn span#bizSelectLabel{max-width:38vw;}
    .modal{width:100%;}
  }
</style>
</head>

<script>
/* =========================================================
   STATE + PERSISTENCE (uses localStorage, saved in this browser)
   ========================================================= */
const STORE_KEYS = { businesses: 'businesses_list', currentBiz: 'current_business_id' };
const CASH_IN_CATEGORIES = ['Sales','Service Income','Loan Received','Investment Received','Interest Income','Refund Received','Commission','Other Income'];
const CASH_OUT_CATEGORIES = ['Purchase','Expense','Salary','Rent','Utilities','Transport','Food','Marketing','Maintenance','Misc'];
const DEFAULT_CATEGORIES = [...CASH_IN_CATEGORIES, ...CASH_OUT_CATEGORIES];
const DEFAULT_MODES = ['Cash','UPI','Bank Transfer','Cheque','Card'];
let state = {
  businesses: [],       // {id, name, address, staffSize, category, subcategory, type, registrationType, email, mobile}
  currentBusinessId: null,
  books: [],             // {id, name, createdAt, updatedAt}
  transactions: {},      // bookId -> [{id,type,date,time,amount,contact,remarks,category,paymentMode}]
  customCategories: []   // user-added transaction categories
};
let route = { page: 'books', bookId: null };

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }
function currentBiz(){ return state.businesses.find(b=>b.id===state.currentBusinessId); }

const LS_PREFIX = 'easybusy_';
async function safeGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }catch(e){ console.warn('storage set failed', e); }
}
async function safeDelete(key){
  try{ localStorage.removeItem(LS_PREFIX + key); }catch(e){}
}

async function loadAll(){
  let businesses = await safeGet(STORE_KEYS.businesses);
  if(!businesses || !businesses.length){
    businesses = [{
      id: uid('biz'), name: "Demo Business",
      address:'', staffSize:'', category:'', subcategory:'', type:'', registrationType:'', email:'', mobile:''
    }];
    await safeSet(STORE_KEYS.businesses, businesses);
  }
  state.businesses = businesses;

  let curId = await safeGet(STORE_KEYS.currentBiz);
  if(!curId || !businesses.find(b=>b.id===curId)) curId = businesses[0].id;
  state.currentBusinessId = curId;
  await safeSet(STORE_KEYS.currentBiz, curId);

  state.customCategories = (await safeGet('custom_categories')) || [];

  await loadBooksForCurrentBusiness();
}

async function persistCustomCategories(){ await safeSet('custom_categories', state.customCategories); }

async function loadBooksForCurrentBusiness(){
  const bizId = state.currentBusinessId;
  let books = await safeGet('books_list_' + bizId);
  if(!books){
    const isDefaultFirstBiz = state.businesses[0] && state.businesses[0].id === bizId;
    if(isDefaultFirstBiz){
      // seed with example books matching the reference screenshots
      books = [
        { id: uid('bk'), name: 'xyz Co', createdAt: Date.now()-2600000, updatedAt: Date.now()-300000 },
        { id: uid('bk'), name: 'Ali Co', createdAt: Date.now()-2600000, updatedAt: Date.now()-360000 },
        { id: uid('bk'), name: 'Business Book', createdAt: Date.now()-2600000000, updatedAt: Date.now()-2600000000 }
      ];
    } else {
      books = [];
    }
    await safeSet('books_list_' + bizId, books);
  }
  state.books = books;
  state.transactions = {};
  for(const b of books){
    const tx = await safeGet('tx_' + bizId + '_' + b.id);
    state.transactions[b.id] = tx || [];
  }
}

async function persistBooks(){ await safeSet('books_list_' + state.currentBusinessId, state.books); }
async function persistTx(bookId){ await safeSet('tx_' + state.currentBusinessId + '_' + bookId, state.transactions[bookId] || []); }
async function persistBusinesses(){ await safeSet(STORE_KEYS.businesses, state.businesses); }
async function persistCurrentBiz(){ await safeSet(STORE_KEYS.currentBiz, state.currentBusinessId); }

/* =========================================================
   SAVE TO DATA FOLDER (File System Access API — Chrome/Edge/
   Opera only; not supported in Firefox or Safari)
   ========================================================= */
const FS_DB_NAME = 'easybusy_fs_handles';
const FS_STORE_NAME = 'handles';
function fsIdbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(FS_STORE_NAME);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function fsIdbSet(key, val){
  const db = await fsIdbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FS_STORE_NAME,'readwrite');
    tx.objectStore(FS_STORE_NAME).put(val, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function fsIdbGet(key){
  const db = await fsIdbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FS_STORE_NAME,'readonly');
    const req = tx.objectStore(FS_STORE_NAME).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

function fmtMoney(n){
  const v = Number(n)||0;
  return (v<0?'-':'') + Math.abs(v).toLocaleString('en-IN', {maximumFractionDigits:2});
}
function fmtAgo(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return 'Updated just now';
  if(min < 60) return 'Updated ' + min + ' minute' + (min===1?'':'s') + ' ago';
  const hr = Math.floor(min/60);
  if(hr < 24) return 'Updated ' + hr + ' hour' + (hr===1?'':'s') + ' ago';
  const day = Math.floor(hr/24);
  if(day < 30) return 'Updated ' + day + ' day' + (day===1?'':'s') + ' ago';
  const mon = Math.floor(day/30);
  return 'Updated about ' + mon + ' month' + (mon===1?'':'s') + ' ago';
}
function bookTotals(bookId){
  const list = state.transactions[bookId] || [];
  let inSum=0, outSum=0;
  list.forEach(t=> t.type==='in' ? inSum+=Number(t.amount) : outSum+=Number(t.amount));
  return { inSum, outSum, net: inSum-outSum, count:list.length };
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Keeps a modal overlay (and its Save button) above the on-screen keyboard on mobile.
// When the keyboard opens, the visual viewport shrinks; we resize/reposition the overlay
// to match it so the modal (and its footer buttons) stay fully visible instead of being
// pushed down behind the keyboard. Returns a cleanup function to call when the modal closes.
function setupKeyboardAvoidingOverlay(ovEl){
  if(!window.visualViewport || !ovEl) return ()=>{};
  const vv = window.visualViewport;
  const modalEl = ovEl.querySelector('.modal');
  const adjust = ()=>{
    ovEl.style.height = vv.height + 'px';
    ovEl.style.top = vv.offsetTop + 'px';
    if(modalEl) modalEl.style.maxHeight = Math.round(vv.height * 0.92) + 'px';
  };
  vv.addEventListener('resize', adjust);
  vv.addEventListener('scroll', adjust);
  adjust();
  return ()=>{
    vv.removeEventListener('resize', adjust);
    vv.removeEventListener('scroll', adjust);
  };
}

// Shows an attached Bill/Receipt file (image or PDF) in a lightbox-style modal.
// Using an in-app viewer instead of window.open() avoids popup blockers silently
// swallowing data: URLs in installed/PWA mode, which was preventing attachments from

// Professional in-app replacement for the browser's native confirm() popup.
// Returns a Promise<boolean> — resolves true only if the user pressed the confirm button.
function showConfirmDialog(message, opts={}){
  const title = opts.title || 'Are you sure?';
  const confirmText = opts.confirmText || 'Delete';
  const cancelText = opts.cancelText || 'Cancel';
  const danger = opts.danger !== false;
  return new Promise((resolve)=>{
    const modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = `
      <div class="overlay center" id="ov">
        <div class="modal confirm-modal" style="height:auto;">
          <div class="confirm-icon ${danger?'danger':''}">${danger ? '⚠️' : 'ℹ️'}</div>
          <h2 class="confirm-title">${escapeHtml(title)}</h2>
          <p class="confirm-msg">${escapeHtml(message)}</p>
          <div class="modal-footer" style="justify-content:center;">
            <button class="btn btn-outline" id="confirmCancelBtn">${escapeHtml(cancelText)}</button>
            <button class="btn ${danger?'btn-red':'btn-primary'}" id="confirmOkBtn">${escapeHtml(confirmText)}</button>
          </div>
        </div>
      </div>
    `;
    const close = (result)=>{ modalRoot.innerHTML=''; resolve(result); };
    document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') close(false); };
    document.getElementById('confirmCancelBtn').onclick = ()=> close(false);
    document.getElementById('confirmOkBtn').onclick = ()=> close(true);
  });
}

// Simple generic row-menu (3-dot "more options") controller — one open at a time, closes on outside click.
let openRowMenuId = null;
function closeRowMenuOnOutsideClick(e){
  if(!e.target.closest('.row-menu-wrap')) closeRowMenu();
}
function closeRowMenu(){
  if(openRowMenuId === null) return;
  const el = document.querySelector(`.row-menu[data-menu-for="${CSS.escape(openRowMenuId)}"]`);
  if(el) el.style.display = 'none';

}
function openRowMenu(id){
  closeRowMenu();

function getFilteredTx(bookId){
  let list = [...(state.transactions[bookId]||[])];
  if(txFilters.type !== 'All') list = list.filter(t=>t.type === (txFilters.type==='Cash In'?'in':'out'));
  if(txFilters.contact !== 'All') list = list.filter(t=> (t.contact||'—') === txFilters.contact);
  if(txFilters.paymentMode !== 'All') list = list.filter(t=> (t.paymentMode||'—') === txFilters.paymentMode);
  if(txFilters.category !== 'All') list = list.filter(t=> (t.category||'—') === txFilters.category);
  if(txSearch.trim()){
    const q = txSearch.toLowerCase();
    list = list.filter(t => (t.remarks||'').toLowerCase().includes(q) || String(t.amount).includes(q));
  }
  list.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time) || b.createdAt-a.createdAt);
  return list;
}

function uniqueVals(bookId, field){
  const list = state.transactions[bookId]||[];
  return [...new Set(list.map(t=>t[field]).filter(Boolean))];
}

// Running balance: cumulative total across ALL entries for the book, in
// chronological order, independent of any filters currently applied.
function computeRunningBalances(bookId){
  const all = [...(state.transactions[bookId]||[])];
  all.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time) || (a.createdAt||0)-(b.createdAt||0));
  let bal = 0;
  const map = {};
  for(const t of all){
    bal += (t.type==='in' ? Number(t.amount)||0 : -(Number(t.amount)||0));
    map[t.id] = bal;
  }
  return map;
}

function fmtTxDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  d.setHours(0,0,0,0);
  if(d.getTime()===today.getTime()) return 'Today';
  if(d.getTime()===yest.getTime()) return 'Yesterday';
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtTxTime(timeStr){
  if(!timeStr) return '';
  const parts = timeStr.split(':');
  const h = Number(parts[0]), m = Number(parts[1]);
  if(isNaN(h)||isNaN(m)) return timeStr;
  const ampm = h>=12 ? 'PM' : 'AM';
  let hh = h % 12; if(hh===0) hh = 12;
  return `${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
}

async function shareSelectedEntries(book){
  const list = state.transactions[book.id].filter(x=>selectedTxIds.has(x.id));
  const lines = list.map(t=>`${fmtTxDate(t.date)} ${fmtTxTime(t.time)} — ${t.type==='in'?'+':'-'}${fmtMoney(t.amount)}${t.remarks ? ' (' + t.remarks + ')' : ''}`);
  const text = `${book.name} — ${list.length} ${list.length===1?'entry':'entries'}\n\n` + lines.join('\n');
  if(navigator.share){
    try{ await navigator.share({title: book.name, text}); return; }catch(e){ /* user cancelled or unsupported, fall through */ }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ await navigator.clipboard.writeText(text); showToast('Copied to clipboard'); return; }catch(e){}
  }
  showToast('Sharing is not supported on this device');
}

   REPORTS (Generate Excel / Generate PDF for a book)
   ========================================================= */
function buildReportData(book){
  const list = getFilteredTx(book.id); // respects current filters/search, same as what's on screen
  const sorted = [...list].sort((a,b)=>{
    const da = (a.date||'') + 'T' + (a.time||'00:00');
    const db = (b.date||'') + 'T' + (b.time||'00:00');
    return da.localeCompare(db) || (a.createdAt||0)-(b.createdAt||0);
  });
  let running = 0;
  const rows = sorted.map(t=>{
    running += t.type==='in' ? Number(t.amount) : -Number(t.amount);
    return { date: fmtTxDate(t.date), mode: t.paymentMode || '—', in: t.type==='in'?t.amount:null, out: t.type==='out'?t.amount:null, balance: running };
  });
  const inSum = sorted.filter(t=>t.type==='in').reduce((s,t)=>s+Number(t.amount),0);
  const outSum = sorted.filter(t=>t.type==='out').reduce((s,t)=>s+Number(t.amount),0);
  const dates = sorted.map(t=>t.date).filter(Boolean).sort();
  const duration = dates.length ? `${fmtTxDate(dates[0])} - ${fmtTxDate(dates[dates.length-1])}` : '—';
  return { rows, inSum, outSum, net: inSum-outSum, count: sorted.length, duration };
}

let reportLibsLoaded = false;
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function generatePDFReport(book){
  const data = buildReportData(book);
  if(!reportLibsLoaded){
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    reportLibsLoaded = true;
  }
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;';
  container.innerHTML = reportHtml(book, data);
  document.body.appendChild(container);
  try{
    const canvas = await html2canvas(container.firstElementChild, {scale:2, backgroundColor:'#ffffff'});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * (imgWidth / canvas.width);
    let heightLeft = imgHeight;
    let position = 0;
    const pageHeight = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`${book.name.replace(/[^a-z0-9]+/gi,'_')}-report.pdf`);
    showToast('PDF report downloaded');
  } finally {
    document.body.removeChild(container);
  }
}



function openTxModal(type, bookId, editEntry){
  const modalRoot = document.getElementById('modalRoot');
  const now = new Date();
  const defDate = editEntry ? editEntry.date : now.toISOString().slice(0,10);
  const defTime = editEntry ? editEntry.time : now.toTimeString().slice(0,5);

  function getCatOptionsForType(t){
    const base = t==='in' ? CASH_IN_CATEGORIES : CASH_OUT_CATEGORIES;
    return [...base, ...state.customCategories.filter(c=>!base.includes(c))];
  }
  let catOptions = getCatOptionsForType(type);
  const modeOptions = DEFAULT_MODES;

  modalRoot.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal tx-modal">
        <div class="modal-head ${type}">
          <h2>${editEntry? 'Edit' : 'Add'} Cash ${type==='in'?'In':'Out'} Entry</h2>
          <button class="modal-close" id="closeModal">✕</button>
        </div>

        <div class="tx-scroll">
          <div class="type-toggle">
            <button id="toggleIn" class="${type==='in'?'sel-in':''}">Cash In</button>
            <button id="toggleOut" class="${type==='out'?'sel-out':''}">Cash Out</button>
          </div>

          <div class="field-row">
            <div class="field">
              <label>Date <span class="req">*</span></label>
              <input type="date" id="fDate" value="${defDate}">
            </div>
            <div class="field">
              <label>Time</label>
              <input type="time" id="fTime" value="${defTime}">
            </div>
          </div>

          <div class="field">
            <label>Amount <span class="req">*</span></label>
            <input type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="1" autocomplete="off" id="fAmount" placeholder="Enter amount" value="${editEntry? editEntry.amount : ''}">
          </div>

          <div id="extraFields" style="display:${editEntry ? '' : 'none'};">
            <div class="field">
              <label>Description</label>
              <input id="fRemarks" placeholder="e.g. Enter Details (Name, Bill No, Item Name, Quantity etc)" value="${editEntry? escapeHtml(editEntry.remarks||'') : ''}">
            </div>

            <div class="field">
              <label>Contact</label>
              <input id="fContact" placeholder="Search or Select" value="${editEntry? escapeHtml(editEntry.contact||'') : ''}">
            </div>

            <div class="field-row">
              <div class="field">
                <label>Category</label>
                <div style="display:flex;gap:6px;">
                  <input list="catList" id="fCategory" placeholder="Search or Select" style="flex:1;" value="${editEntry? escapeHtml(editEntry.category||'') : ''}">
                  <datalist id="catList">${catOptions.map(c=>`<option value="${c}">`).join('')}</datalist>
                </div>
                <button type="button" id="addCatBtn" style="background:none;border:none;color:var(--blue);font-weight:600;font-size:12px;padding:6px 0 0;cursor:pointer;">+ Add New Category</button>
              </div>
              <div class="field">
                <label>Payment Mode</label>
                <input list="modeList" id="fMode" placeholder="Search or Select" value="${editEntry? escapeHtml(editEntry.paymentMode||'') : ''}">
                <datalist id="modeList">${modeOptions.map(m=>`<option value="${m}">`).join('')}</datalist>
              </div>
            </div>

            <div class="field">
              <label>Bill / Receipt (optional)</label>
              <input type="file" id="fBill" accept="image/*,.pdf">
              <div id="billPreview" style="font-size:12px;color:var(--text-dim);margin-top:6px;"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline" id="saveAddNewBtn">Save &amp; Add New</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>

      </div>
    </div>
  `;

  let curType = type;
  let billData = editEntry && editEntry.bill ? {...editEntry.bill} : null;

  // Keep Save / Save & Add New visible above the on-screen keyboard instead of
  // being pushed off-screen behind it when a field (Amount, Remarks, etc.) is focused.
  const ovEl = document.getElementById('ov');
  let removeKeyboardListener = ()=>{};
  if(window.visualViewport){
    const vv = window.visualViewport;
    const adjustForKeyboard = ()=>{
      ovEl.style.height = vv.height + 'px';
      ovEl.style.top = vv.offsetTop + 'px';
    };
    vv.addEventListener('resize', adjustForKeyboard);
    vv.addEventListener('scroll', adjustForKeyboard);
    adjustForKeyboard();
    removeKeyboardListener = ()=>{
      vv.removeEventListener('resize', adjustForKeyboard);
      vv.removeEventListener('scroll', adjustForKeyboard);
    };
  }

  const close = ()=>{ removeKeyboardListener(); modalRoot.innerHTML=''; };
  document.getElementById('closeModal').onclick = close;
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') close(); };
  document.getElementById('toggleIn').onclick = ()=>{ curType='in'; refreshToggle(); };
  document.getElementById('toggleOut').onclick = ()=>{ curType='out'; refreshToggle(); };

  // Progressive disclosure: Contact/Remarks/Category/Payment/Bill only appear once an amount is entered.
  const amountEl = document.getElementById('fAmount');
  const extraFieldsEl = document.getElementById('extraFields');
  function updateExtraFieldsVisibility(){
    const hasAmount = amountEl.value.trim().length > 0;
    const wasHidden = extraFieldsEl.style.display === 'none';
    extraFieldsEl.style.display = hasAmount ? '' : 'none';
    if(hasAmount && wasHidden) extraFieldsEl.classList.add('extra-fields-enter');
  }
  amountEl.addEventListener('input', ()=>{
    // Amount is digits only; strip any non-numeric characters.
    const clean = amountEl.value.replace(/\D/g, '');
    if(amountEl.value !== clean) amountEl.value = clean;
    updateExtraFieldsVisibility();
  });
  amountEl.addEventListener('keydown', (e)=>{
    // Keep the native mobile numeric keyboard, but prevent letters, signs,
    // exponent notation and other non-digit characters on physical keyboards.
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const allowed = ['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Tab','Enter'];
    if(allowed.includes(e.key)) return;
    if(!/^[0-9]$/.test(e.key)) e.preventDefault();
  });
  amountEl.addEventListener('paste', (e)=>{
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const clean = text.replace(/\D/g, '');
    const start = amountEl.selectionStart ?? amountEl.value.length;
    const end = amountEl.selectionEnd ?? amountEl.value.length;
    amountEl.value = amountEl.value.slice(0,start) + clean + amountEl.value.slice(end);
    amountEl.dispatchEvent(new Event('input',{bubbles:true}));
  });
  updateExtraFieldsVisibility();

  document.getElementById('addCatBtn').onclick = async ()=>{
    const name = prompt('New category name');
    if(!name || !name.trim()) return;
    const clean = name.trim();
    if(!catOptions.includes(clean)){
      state.customCategories.push(clean);
      await persistCustomCategories();
    }
    const catField = document.getElementById('fCategory');
    catField.value = clean;
    const dl = document.getElementById('catList');
    if(![...dl.options].some(o=>o.value===clean)){
      dl.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(clean)}">`);
    }
    catField.focus();
  };
  function refreshToggle(){
    document.getElementById('toggleIn').className = curType==='in'?'sel-in':'';
    document.getElementById('toggleOut').className = curType==='out'?'sel-out':'';
    document.querySelector('.modal-head').className = 'modal-head ' + curType;
    document.querySelector('.modal-head h2').textContent = (editEntry?'Edit':'Add') + ' Cash ' + (curType==='in'?'In':'Out') + ' Entry';
    catOptions = getCatOptionsForType(curType);
    const dl = document.getElementById('catList');
    dl.innerHTML = catOptions.map(c=>`<option value="${escapeHtml(c)}">`).join('');
    const catField = document.getElementById('fCategory');
    if(!catOptions.includes(catField.value.trim())) catField.value = '';
  }

  function renderBillPreview(){
    const el = document.getElementById('billPreview');
    if(billData){
      const isImage = billData.dataUrl && billData.dataUrl.startsWith('data:image');
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;">
          ${isImage ? `<img src="${billData.dataUrl}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">` : `<span style="font-size:18px;">📄</span>`}
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(billData.name)}</span>
          <button type="button" id="viewBillBtn" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;font-weight:600;text-decoration:underline;">View</button>
          <button type="button" id="removeBillBtn" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;text-decoration:underline;">Remove</button>
        </div>`;
      document.getElementById('viewBillBtn').onclick = ()=> openBillViewer(billData);
      document.getElementById('removeBillBtn').onclick = ()=>{ billData = null; document.getElementById('fBill').value=''; renderBillPreview(); };
    } else {
      el.textContent = '';
    }
  }
  renderBillPreview();
  document.getElementById('fBill').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 3*1024*1024){ showToast('Bill file too large (max 3MB)'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{ billData = { name: file.name, dataUrl: reader.result }; renderBillPreview(); };
    reader.readAsDataURL(file);
  };

  function readForm(){
    const dateV = document.getElementById('fDate').value;
    const timeV = document.getElementById('fTime').value;
    const rawAmount = document.getElementById('fAmount').value.trim();
    const amount = /^[0-9]+$/.test(rawAmount) ? Number(rawAmount) : NaN;
    return {
      date: dateV, time: timeV, amount,
      contact: document.getElementById('fContact').value.trim(),
      remarks: document.getElementById('fRemarks').value.trim(),
      category: document.getElementById('fCategory').value.trim(),
      paymentMode: document.getElementById('fMode').value.trim(),
      bill: billData
    };
  }

  async function save(andAddNew){
    const data = readForm();
    if(!data.date){ showToast('Please select a date'); return; }
    if(!data.amount || isNaN(data.amount) || data.amount<=0){ showToast('Please enter a valid amount'); return; }
    const book = state.books.find(b=>b.id===bookId);

    if(editEntry){
      Object.assign(editEntry, data, {type: curType});
    } else {
      const entry = { id: uid('tx'), type: curType, createdAt: Date.now(), ...data };
      state.transactions[bookId].unshift(entry);
    }
    book.updatedAt = Date.now();
    await persistTx(bookId);
    await persistBooks();
    showToast('Entry saved');
    if(andAddNew && !editEntry){
      renderTxPage();
      openTxModal(curType, bookId);
    } else {
      close();
      renderTxPage();
    }
  }

  document.getElementById('saveBtn').onclick = ()=> save(false);
  document.getElementById('saveAddNewBtn').onclick = ()=> save(true);
}

      <div class="settings-field-body">
        <label>${label}</label>

        </div>
      </div>

}
function selectField(icon, label, key, biz, options, placeholder){
  const val = biz[key]||'';
  return `
    <div class="settings-field">
      <div class="settings-field-icon">${icon}</div>
      <div class="settings-field-body">
        <label>${label}</label>
        <select data-select-field="${key}">
          <option value="" ${val===''?'selected':''}>${placeholder}</option>
          ${options.map(o=>`<option value="${escapeHtml(o)}" ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

function renderProfileTab(){
  const biz = currentBiz();
  const content = document.getElementById('settingsContent');
  const fieldDefs = ['name','address','staffSize','category','subcategory','type','registrationType','email','mobile'];
  const filled = fieldDefs.filter(k => (biz[k]||'').toString().trim() !== '').length;
  const total = fieldDefs.length;
  const pct = Math.round((filled/total)*100);
  const strengthLabel = pct < 40 ? 'Low' : pct < 75 ? 'Medium' : 'High';
  const strengthClass = pct < 40 ? '' : pct < 75 ? 'med' : 'high';
  const incomplete = total - filled;

  content.innerHTML = `
    <div class="profile-card">
      <div class="profile-card-head">
        <div class="book-icon">🏢</div>
        <div>
          <div class="profile-title">${escapeHtml(biz.name)}</div>
          ${incomplete>0? `<div class="profile-warn">⚠ Incomplete business profile</div>` : ''}
        </div>
      </div>
      <div class="strength-row"><span>Profile Strength: ${strengthLabel}</span><span>${pct}%</span></div>
      <div class="strength-bar"><div class="strength-bar-fill ${strengthClass}" style="width:${pct}%"></div></div>
      ${incomplete>0? `<div class="incomplete-banner">ℹ️ ${incomplete} out of ${total} fields are incomplete. Fill these to complete your profile</div>` : ''}
    </div>

    <div class="settings-section">
      <h4>Basics</h4>
      ${textField('🏢','Business Name','name', biz, 'Business name')}
      ${textField('📍','Business Address','address', biz, 'Add business address')}
      ${selectField('👥','Staff Size','staffSize', biz, ['1-5','6-10','11-25','26-50','50+'], 'Select staff size')}
    </div>

    <div class="settings-section">
      <h4>Business Info</h4>
      ${selectField('◇','Business Category','category', biz, ['Retail','Services','Manufacturing','Wholesale','Other'], 'Select business category')}
      ${selectField('→','Business Subcategory','subcategory', biz, ['General','Specialty','Online','Other'], 'Select business subcategory')}
      ${selectField('▭','Business Type','type', biz, ['Sole Proprietorship','Partnership','Private Limited','LLP'], 'Select business type')}
      ${selectField('👤','Business Registration Type','registrationType', biz, ['GST Registered','Unregistered','Other'], 'Select registration type')}
    </div>

    <div class="settings-section">
      <h4>Communication</h4>
      ${textField('✉️','Business Email','email', biz, 'Enter business email')}
      ${textField('📞','Business Mobile Number','mobile', biz, 'Enter business mobile number')}
    </div>
  `;

  content.querySelectorAll('[data-edit-field]').forEach(btn=>{
    btn.onclick = ()=> toggleFieldEdit(btn.getAttribute('data-edit-field'));
  });
  content.querySelectorAll('[data-select-field]').forEach(sel=>{
    sel.onchange = async (e)=>{
      const key = sel.getAttribute('data-select-field');
      biz[key] = e.target.value;
      await persistBusinesses();
      renderProfileTab();
    };
  });
}

async function toggleFieldEdit(key){
  const input = document.getElementById('field_' + key);
  const btn = document.querySelector(`[data-edit-field="${key}"]`);
  if(input.disabled){
    input.disabled = false;
    input.focus();
    btn.textContent = '✔️';
    return;
  }
  const biz = currentBiz();
  const val = input.value.trim();
  if(key === 'name' && !val){ showToast('Business name cannot be empty'); input.focus(); return; }
  biz[key] = val;
  await persistBusinesses();
  if(key === 'name'){
    document.getElementById('bizSelectLabel').textContent = biz.name;
  }
  showToast('Saved');
  renderProfileTab();
}

  const content = document.getElementById('settingsContent');
  const canDelete = state.businesses.length > 1;
  content.innerHTML = `
    <div class="settings-section">
      <h4>Primary Admin</h4>
      <p style="font-size:13px;color:var(--text-dim);margin:0;">You are the primary admin of this business.</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-backup btn-export" id="exportDataBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Backup</button>
        <button class="btn btn-backup btn-import" id="importDataBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Import Backup</button>
      </div>
      <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">
    </div>
    <div class="danger-zone">
      <h4>Delete Business</h4>
      <p>${canDelete ? 'Permanently delete this business and all its books and entries.' : 'You need at least one other business before you can delete this one.'}</p>
      <button class="btn btn-red" id="deleteBizBtn" ${canDelete?'':'disabled'}>Delete Business</button>
    </div>
  `;
  document.getElementById('exportDataBtn').onclick = exportAllData;
  const importInput = document.getElementById('importFileInput');
  document.getElementById('importDataBtn').onclick = ()=> importInput.click();
  importInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) importAllData(file);
    importInput.value = '';
  };
  const btn = document.getElementById('deleteBizBtn');
  if(canDelete){
    btn.onclick = async ()=>{
      const biz = currentBiz();
      const ok = await showConfirmDialog(`Delete "${biz.name}"? This will remove all its books and entries.`, {title:'Delete this business?'});
      if(!ok) return;
      const idx = state.businesses.findIndex(b=>b.id===biz.id);
      const bookIds = state.books.map(b=>b.id);
      state.businesses.splice(idx,1);
      await persistBusinesses();
      await safeDelete('books_list_' + biz.id);
      for(const bookId of bookIds){ await safeDelete('tx_' + biz.id + '_' + bookId); }
      showToast('Business deleted');
      await switchBusiness(state.businesses[0].id);
    };
  }
}

/* =========================================================
   BACKUP / RESTORE (export all data to a .json file, and
   restore it back in — works on any device/browser)
   ========================================================= */
async function buildBackupPayload(){
  const payload = {
    app: 'EasyBusy',
    exportedAt: new Date().toISOString(),
    businesses: state.businesses,
    currentBusinessId: state.currentBusinessId,
    customCategories: state.customCategories,
    books: {},       // businessId -> books[]
    transactions: {} // businessId -> { bookId -> tx[] }
  };
  for(const biz of state.businesses){
    const books = (await safeGet('books_list_' + biz.id)) || [];
    payload.books[biz.id] = books;
    payload.transactions[biz.id] = {};
    for(const bk of books){
      payload.transactions[biz.id][bk.id] = (await safeGet('tx_' + biz.id + '_' + bk.id)) || [];
    }
  }
  return payload;
}

async function exportAllData(){
  const payload = await buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const stamp = new Date().toISOString().slice(0,10);
  const suggestedName = `EasyBusy-backup-${stamp}.json`;

  // Chrome/Edge (and other supporting browsers): show a real Save As/location picker.
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{description:'EasyBusy Backup', accept:{'application/json':['.json']}}]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      showToast('Backup saved');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
      showToast('Could not open save location');
      return;
    }
  }

  // Fallback for browsers that do not support the Save As API.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = suggestedName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function importAllData(file){
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    showToast('Invalid backup file');
    return;
  }
  if(!data || !Array.isArray(data.businesses)){
    showToast('This file is not a valid EasyBusy backup');
    return;
  }
  const ok = await showConfirmDialog('Importing will replace all current data in this browser with the backup. Continue?', {title:'Replace current data?', confirmText:'Import'});
  if(!ok) return;

  await safeSet(STORE_KEYS.businesses, data.businesses);
  await safeSet(STORE_KEYS.currentBiz, data.currentBusinessId || (data.businesses[0] && data.businesses[0].id));
  await safeSet('custom_categories', data.customCategories || []);

  for(const bizId of Object.keys(data.books || {})){
    await safeSet('books_list_' + bizId, data.books[bizId] || []);
    const txByBook = (data.transactions && data.transactions[bizId]) || {};
    for(const bookId of Object.keys(txByBook)){
      await safeSet('tx_' + bizId + '_' + bookId, txByBook[bookId] || []);
    }
  }

  showToast('Backup restored');
  await loadAll();
  setupBizSelect();
  route = { page:'books', bookId:null };
  renderBooksPage();
}

/* =========================================================
   MOBILE SIDEBAR (hamburger toggle drawer)
   ========================================================= */
function setupMobileSidebar(){
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const toggleBtn = document.getElementById('menuToggleBtn');
  const closeBtn = document.getElementById('sidebarCloseBtn');

  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('show');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }

  toggleBtn.onclick = ()=>{
    if(sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
  };
  overlay.onclick = closeSidebar;
  if(closeBtn) closeBtn.onclick = closeSidebar;

  // close the drawer whenever a nav link is used on mobile
  document.getElementById('navCashbooks').addEventListener('click', closeSidebar);
  document.getElementById('navBizSettings').addEventListener('click', closeSidebar);

  // if the window is resized back to desktop width, make sure the drawer state is reset
  window.addEventListener('resize', ()=>{
    if(window.innerWidth > 860) closeSidebar();
  });
}

async function init(){
  await loadAll();
  setupBizSelect();
  setupSupportBtn();

  // Sidebar backup shortcuts (same working backup functions as Settings)
  const sidebarExportBtn = document.getElementById('sidebarExportBtn');
  if(sidebarExportBtn) sidebarExportBtn.onclick = exportAllData;

  const sidebarImportBtn = document.getElementById('sidebarImportBtn');
  const sidebarImportInput = document.getElementById('sidebarImportFileInput');
  if(sidebarImportBtn && sidebarImportInput){
    sidebarImportBtn.onclick = ()=> sidebarImportInput.click();
    sidebarImportInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) importAllData(file);
      e.target.value = '';
    };
  }

  setupMobileSidebar();
  document.getElementById('navCashbooks').onclick = ()=>{ route = { page:'books', bookId:null }; renderBooksPage(); };
  document.getElementById('navBizSettings').onclick = ()=>{ route = { page:'settings' }; renderSettingsPage(); };
  renderBooksPage();
}
init();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    });

    // When a new service worker takes over (i.e. you deployed an update),
    // reload the page once so the user sees the new version automatically —
    // no need to delete the app or clear browser data.
    let swRefreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (swRefreshed) return;
      swRefreshed = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
